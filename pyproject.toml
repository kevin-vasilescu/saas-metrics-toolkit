[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-metrics-toolkit"
version = "0.1.0"
description = "Turn raw subscription data into MRR, churn, NRR, LTV/CAC and cohort retention reports in one command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kevin-Ayan-Andrei Vasilescu" }]
keywords = ["saas", "metrics", "mrr", "churn", "cohort", "pandas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = ["pandas>=2.0", "typer>=0.12", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "build>=1.2", "twine>=5"]

[project.scripts]
saas-metrics = "saas_metrics.cli:app"

[project.urls]
Homepage = "https://github.com/kevin-vasilescu/saas-metrics-toolkit"
Issues = "https://github.com/kevin-vasilescu/saas-metrics-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_metrics"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["saas_metrics"]
branch = true
